# Crunchy defaults. Edit this file (or drop crunchy.ini / crunchy.json in the
# working directory) to change launch defaults. Later files override earlier
# ones: package → clone root → cwd → $CRUNCHY_CONFIG.
#
# Keys in [crunchy] set crunchy_settings.
# Any key that also exists on the loaded workflow overrides that workflow default.

[crunchy]
inpath = CrunchyIn
outpath = CrunchyOut
nthreads = 2
wait = 5
idle = 1.0
ram_reserve = 4.0

[workflow]
# Example: set_count = 4
